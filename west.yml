manifest:
  version: "0.13"

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    # nRF Connect SDK v3.4.2 (first NCS LTS line, 5-year patch support).
    # Imports the full NCS manifest (sdk-nrf's west.yml), which in turn
    # imports Zephyr 4.4.2 via its own name-allowlist.
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.2
      import: true

    # Zephyr Rust language support (external module, experimental).
    # Not part of the NCS manifest; the revision matches the pin in
    # sdk-zephyr/submanifests/optional.yaml for ncs-v3.4.2.
    - name: zephyr-lang-rust
      remote: zephyrproject
      revision: dd73abc242e995784da62352fe8c70d9a6c7ac2e
      path: modules/lang/rust

  self:
    path: study-Zephyr-rust
